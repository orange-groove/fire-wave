services:
  - type: web
    name: fire-wave
    env: node
    buildCommand: yarn install && yarn build
    startCommand: yarn start
    envVars:
      - key: NODE_ENV
        value: production 
      # Keep Node's heap below Render's 512MB limit.
      # Prevents the OS from killing the process during memory spikes.
      - key: NODE_OPTIONS
        value: --max-old-space-size=384